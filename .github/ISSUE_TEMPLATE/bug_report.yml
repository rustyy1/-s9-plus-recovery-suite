name: Bug Report
description: Create a bug report to help improve S9+ Recovery & HDMI Control Suite
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "S9+ HDMI Viewer & Controller (main_hdmi_viewer.py)"
        - "Galaxy S9+ Recovery Console (main.py)"
        - "ADB Communication & Input Control"
        - "UVC Camera / Video Ingestion"
        - "Samsung DeX Switching"
        - "PyInstaller Build / Standalone Executable"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows Version & Architecture
      placeholder: "e.g. Windows 11 Pro 64-bit (23H2)"
    validations:
      required: true
  - type: textarea
    id: hardware-setup
    attributes:
      label: Hardware Setup Details
      description: What USB-C hub, HDMI cable, capture card, or USB mouse are you using?
      placeholder: "e.g., Anker 7-in-1 USB-C Hub, Elgato Cam Link 4K, OEM Samsung Fast Charger"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Connect S9+ to USB-C hub
        2. Run 'python main_hdmi_viewer.py'
        3. Click '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs / Terminal Output
      render: shell
