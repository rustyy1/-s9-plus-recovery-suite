name: Feature Request
description: Suggest an idea or new hardware/device support for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a feature request or support suggestion for other Samsung/Android devices?
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the challenge you are facing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
    validations:
      required: false
